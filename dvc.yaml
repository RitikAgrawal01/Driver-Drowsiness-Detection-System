# ─────────────────────────────────────────────────────────────────────────────
# dvc.yaml — the 7-stage training pipeline (v2). All settings come from params.yaml.
# (extract_landmarks runs once per fold in data.folds: extract_landmarks@1, @2, ...)
#
#   dvc repro            # run what is stale (Airflow's DAGs call exactly this)
#   dvc dag              # show the graph
#   dvc status           # what changed
#
# Run with the project venv and MLflow reachable, e.g.:  bash scripts/run_pipeline.sh
# Analysis (random split vs LOSO): analysis/dvc.yaml
# ─────────────────────────────────────────────────────────────────────────────
stages:

  # One stage per RLDD fold (extract_landmarks@1, @2, ...): adding a fold to params.yaml
  # data.folds only processes that fold. data/raw/fold<N> is usually a symlink to an external
  # drive; DVC hashes the real files behind it. The sealed test fold is refused by the script.
  extract_landmarks:
    foreach: ${data.folds}
    do:
      cmd: python -m pipeline.extract_landmarks --fold ${item}
      desc: 'Video -> 10 fps landmarks (rotation applied, real image size, MediaPipe video mode)'
      deps:
      - data/raw/fold${item}
      - pipeline/extract_landmarks.py
      - pipeline/dataset.py
      - ddd_core/geometry.py
      params:
      - extract
      - data.sealed_test_fold
      outs:
      - data/landmarks_10fps/fold${item}
      - reports/samples/fold${item}
      metrics:
      - reports/extraction/fold${item}.json:
          cache: false

  frame_features:
    cmd: python -m pipeline.frame_features
    desc: 'Per-frame EAR, inner-lip MAR, head pose (same function the backend uses)'
    deps:
    - data/landmarks_10fps
    - pipeline/frame_features.py
    - pipeline/dataset.py
    - ddd_core/geometry.py
    params:
    - data
    outs:
    - data/frame_features.parquet

  window_features:
    cmd: python -m pipeline.window_features
    desc: 'Time-based windows (15/30/60 s, 2 s stride) -> 9 fixed + 3 blink features'
    deps:
    - data/frame_features.parquet
    - pipeline/window_features.py
    - ddd_core/windows.py
    params:
    - features
    - extract.target_fps
    outs:
    - data/windows.parquet
    metrics:
    - reports/window_summary.json:
        cache: false

  train_evaluate:
    cmd: python -m pipeline.train_evaluate
    desc: 'Nested leave-one-participant-out: PERCLOS rule, logreg, SVM, XGBoost x 3 feature sets'
    deps:
    - data/windows.parquet
    - pipeline/train_evaluate.py
    - pipeline/models.py
    - pipeline/evaluation.py
    - ddd_core/windows.py
    params:
    - cv
    - models
    - mlflow.experiment
    outs:
    - data/loso_predictions.parquet
    - reports/loso_choices.json:
        cache: false
    - reports/loso_per_participant.csv:
        cache: false
    metrics:
    - reports/loso_metrics.json:
        cache: false

  gate:
    cmd: python -m pipeline.gate
    desc: 'Pre-registered gate; exit 1 (pipeline stops, nothing promoted) if it fails; fails closed'
    deps:
    - reports/loso_metrics.json
    - pipeline/gate.py
    params:
    - gate
    - features.main_set
    - mlflow
    outs:
    - reports/gate.json:
        cache: false

  train_final:
    cmd: python -m pipeline.train_final
    desc: 'Fit the gated model on all 12 participants; register it in MLflow with alias @champion'
    deps:
    - reports/gate.json
    - data/windows.parquet
    - pipeline/train_final.py
    - pipeline/models.py
    - pipeline/pyfunc_model.py
    params:
    - models
    - cv
    - mlflow
    - drift.bins
    - features.main_set
    outs:
    - data/drift_baseline.json
    - reports/final_model.json:
        cache: false

  report:
    cmd: python -m pipeline.report
    desc: 'Write reports/RESULTS.md and the per-participant chart'
    deps:
    - reports/extraction
    - reports/window_summary.json
    - reports/loso_metrics.json
    - reports/loso_per_participant.csv
    - reports/leaky_vs_loso.json
    - reports/gate.json
    - reports/final_model.json
    - pipeline/report.py
    params:
    - data
    outs:
    - reports/RESULTS.md:
        cache: false
    plots:
    - reports/per_participant_auc.png:
        cache: false
