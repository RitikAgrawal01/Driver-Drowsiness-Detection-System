# ─────────────────────────────────────────────────────────────────────────────
# params.yaml — the SINGLE source of truth for every tunable setting (v2).
#
# Read by: every DVC stage (via ddd_core.config), the Airflow DAGs (they run `dvc repro`),
# the backend and the model server (mounted read-only, DDD_PARAMS=/app/params.yaml).
# .env holds infrastructure only (hosts, ports, passwords) — never model or feature settings.
# CI checks that dvc.lock was produced with exactly these values (scripts/check_params_lock.py).
# ─────────────────────────────────────────────────────────────────────────────

data:
  folds: [1, 2]             # UTA-RLDD folds used for training + LOSO evaluation (raw in data/raw/fold<N>)
  sealed_test_fold: 4       # final test only: refused by every stage until then

extract:
  target_fps: 10           # frames per second sampled from each video (by timestamp)
  max_side: 960             # downscale so the longer side is at most this (pixels)
  apply_rotation: true      # apply the video's rotation metadata (10 of 24 videos are rotated)
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  workers: 4                # videos processed in parallel

features:
  ear_closed: 0.20          # EAR below this = eye closed (PERCLOS and blink detection)
  long_closure_s: 0.5       # closures at least this long count as "long" (microsleep-like)
  window_lengths_s: [15, 30, 60]   # candidate window lengths; chosen on validation, never on test
  stride_s: 2               # step between window starts (training) / between predictions (serving)
  min_face_ratio: 0.8       # drop windows where the face was found in < 80 % of expected frames
  main_set: v2_12           # feature set the champion is chosen from (see ddd_core.windows)

cv:
  inner_splits: 4           # GroupKFold by participant inside each outer LOSO fold
  n_jobs: 4

models:
  logreg:
    C: [0.01, 0.1, 1.0, 10.0]
  svm:
    C: [0.1, 1.0, 10.0]
    gamma: [0.03, 0.1, 0.3]
  xgboost:
    max_depth: [2, 4, 6]
    min_child_weight: [1, 10]
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    max_estimators: 2000
    early_stopping_rounds: 50

# Pre-registered gate (written before any v2 result was seen). Fails closed.
gate:
  must_beat_baseline: rule  # champion's mean per-participant ROC-AUC must beat the PERCLOS rule
  min_pooled_roc_auc: 0.70  # and pooled LOSO ROC-AUC must be at least this
  min_gain_over_champion: 0.0   # and beat the current registered champion's LOSO AUC by this much
  # Deployment policy (added after the first v2 run, gate rules above unchanged): if no ML model
  # passes, deploy the PERCLOS rule baseline instead — provided IT meets min_pooled_roc_auc and
  # beats the current champion. Set false to deploy nothing when ML fails.
  deploy_baseline_if_ml_fails: true

mlflow:
  experiment: drowsiness_v2_loso
  model_name: drowsiness_classifier_v2
  alias: champion

serving:
  target_fps: 10            # frames the backend samples per second (must equal extract.target_fps)
  max_frame_bytes: 600000   # reject larger base64 frames
  max_side: 960             # same downscale as training
  alarm_on_s: 4             # drowsy predictions sustained this long -> alarm
  alarm_off_s: 6            # alert predictions sustained this long -> clear alarm
  no_face_warn_s: 3         # face missing this long -> "no_face" warning (never "alert")
  min_fps: 6                # measured input fps below this -> "degraded"
  model_timeout_s: 2.0

drift:
  method: psi
  bins: 10
  psi_threshold: 0.25       # PSI > 0.25 = major shift (common rule of thumb)
  min_windows: 60           # don't score drift on fewer windows than this
  buffer_windows: 600       # rolling buffer of de-duplicated live windows (all sessions)

slo:                        # service-level objectives -> monitoring/prometheus/alert_rules.yml (generated)
  p95_latency_s: 0.2        # frame -> prediction, end to end
  max_error_ratio: 0.05     # failed model calls / model calls
  drift_for: 10m            # drift must persist this long before it pages / triggers retraining

retrain:
  cooldown_hours: 6         # webhook ignores repeat drift triggers within this window

exploratory:                # analysis/calibration_experiment.py (Fold 1 only, NOT a final test)
  monotone:                 # +1: feature can only raise the drowsiness score, -1: only lower it
    perclos: 1
    blink_dur_mean_s: 1
    long_closure_rate_pm: 1
    ear_mean: -1
    ear_min: -1

leaky_reference:            # analysis/dvc.yaml: random split vs LOSO with v1 settings
  window_length_s: 15
  test_size: 0.2
  random_state: 42
