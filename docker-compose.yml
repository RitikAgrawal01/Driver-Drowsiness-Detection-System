# ═══════════════════════════════════════════════════════════════════════════════
# Driver Drowsiness Detection — Docker Compose (v2)
#
#   frontend      React (Vite -> Nginx)                         :3000
#   backend       FastAPI + WebSocket + MediaPipe               :8000
#   model_server  FastAPI, MLflow pyfunc @champion              :8001
#   mlflow        tracking + registry (artifacts proxied)       :5000
#   prometheus    metrics + alert rules (generated from params) :9090
#   alertmanager  routing: action=retrain -> webhook, else page :9093
#   webhook       Alertmanager -> Airflow bridge                (internal)
#   grafana       dashboards                                    :3001
#   airflow       runs `dvc repro` on the mounted repo          :8080  (profile: airflow)
#
#   python scripts/init_env.py          # once: .env with random secrets
#   docker compose up -d --build
#   docker compose --profile airflow up -d --build
#
# Settings: params.yaml (mounted read-only into every service) = behaviour; .env = infrastructure.
# ═══════════════════════════════════════════════════════════════════════════════

# No `name:` — the project name stays the folder name, so the existing volumes (MLflow runs and
# registry, including the v1 history) keep being used.

networks:
  ddd_network:
    driver: bridge

volumes:
  mlflow_artifacts:
  mlflow_db:
  prometheus_data:
  alertmanager_data:
  grafana_data:

x-params: &params ./params.yaml:/app/params.yaml:ro

services:

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://127.0.0.1:${BACKEND_PORT:-8000}
        VITE_WS_URL: ws://127.0.0.1:${BACKEND_PORT:-8000}
        VITE_GRAFANA_URL: http://127.0.0.1:${GRAFANA_PORT:-3001}
        VITE_MLFLOW_URL: http://127.0.0.1:${MLFLOW_PORT:-5000}
        VITE_AIRFLOW_URL: http://127.0.0.1:${AIRFLOW_PORT:-8080}
        VITE_PROMETHEUS_URL: http://127.0.0.1:${PROMETHEUS_PORT:-9090}
    container_name: ddd_frontend
    ports: ["${FRONTEND_PORT:-3000}:80"]
    depends_on:
      backend: {condition: service_healthy}
    networks: [ddd_network]
    restart: unless-stopped

  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    container_name: ddd_backend
    ports: ["${BACKEND_PORT:-8000}:8000"]
    environment:
      MODEL_SERVER_URL: http://model_server:8001
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AIRFLOW_URL: http://airflow:8080
      AIRFLOW_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes: [*params]
    depends_on:
      model_server: {condition: service_healthy}
    networks: [ddd_network]
    restart: unless-stopped

  model_server:
    build: {context: ., dockerfile: model_server/Dockerfile}
    container_name: ddd_model_server
    ports: ["${MODEL_SERVER_PORT:-8001}:8001"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes: [*params]
    depends_on:
      mlflow: {condition: service_healthy}
    networks: [ddd_network]
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.1
    container_name: ddd_mlflow
    ports: ["${MLFLOW_PORT:-5000}:5000"]
    # Artifacts are PROXIED through the server (mlflow-artifacts:/), so clients never need the
    # server's disk. v1 used a plain local path, which made every client write locally.
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --default-artifact-root mlflow-artifacts:/
      --serve-artifacts
    volumes:
      - mlflow_db:/mlflow
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [ddd_network]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ddd_prometheus
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle       # admin API removed (v1 enabled it)
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks: [ddd_network]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ddd_alertmanager
    ports: ["${ALERTMANAGER_PORT:-9093}:9093"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [ddd_network]
    restart: unless-stopped

  webhook:
    build: {context: ., dockerfile: tools/webhook.Dockerfile}
    container_name: ddd_webhook
    environment:
      AIRFLOW_URL: http://airflow:8080
      AIRFLOW_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN}
    volumes: [*params]
    networks: [ddd_network]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ddd_grafana
    ports: ["${GRAFANA_PORT:-3001}:3000"]
    env_file: [./monitoring/grafana/grafana.env]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [ddd_network]
    restart: unless-stopped

  airflow:
    build: {context: ., dockerfile: airflow/Dockerfile}
    container_name: ddd_airflow
    profiles: ["airflow"]
    user: "${AIRFLOW_UID:-1000}:0"    # host user, so `dvc repro` can write to the mounted repo
    ports: ["${AIRFLOW_PORT:-8080}:8080"]
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor   # demo setup; production: LocalExecutor/Celery + Postgres
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"   # alert-triggered runs must not sit queued
      AIRFLOW__CORE__DAGS_FOLDER: ${REPO_DIR}/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/home/airflow.db
      AIRFLOW_HOME: /opt/airflow/home
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      DDD_REPO: ${REPO_DIR}
      DDD_PARAMS: ${REPO_DIR}/params.yaml
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_SERVER_URL: http://model_server:8001
      BACKEND_URL: http://backend:8000
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      PYTHONPATH: ${REPO_DIR}:${REPO_DIR}/airflow/dags
      GLOG_minloglevel: "2"
    volumes:
      # The repo at the SAME absolute path as on the host: DVC's cache uses absolute symlinks.
      - .:${REPO_DIR}
      - ${DVC_REMOTE_DIR}:${DVC_REMOTE_DIR}              # same path as in .dvc/config
      - ./logs/airflow_home:/opt/airflow/home            # owned by the host user (gitignored)
    working_dir: ${REPO_DIR}
    depends_on:
      mlflow: {condition: service_healthy}
    networks: [ddd_network]
    restart: unless-stopped
    command: ["bash", "${REPO_DIR}/airflow/entrypoint.sh"]
