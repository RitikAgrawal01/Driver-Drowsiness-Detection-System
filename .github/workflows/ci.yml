# ─────────────────────────────────────────────────────────────────────────────
# CI — Driver Drowsiness Detection (v2)
#
#   lint ──┬── tests (pytest + coverage floor) ──┬── docker-build (all 5 images)
#          └── pipeline-config checks ───────────┘
#
# Every step fails the job on error: no `|| true`, no warning-only steps.
# To make CI *gate* merges, enable branch protection on main with these jobs as required
# checks (Settings -> Branches -> Add rule -> Require status checks / pull request).
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PY_DIRS: ddd_core pipeline analysis backend model_server airflow/dags tools scripts tests

jobs:
  lint:
    name: Lint (black, isort, flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install black==24.4.2 isort==5.13.2 flake8==7.0.0
      - run: black --check --diff $PY_DIRS
      - run: isort --check-only --diff $PY_DIRS
      - run: flake8 $PY_DIRS

  tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-pipeline.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (fails under the coverage floor)
        run: >
          pytest tests -q
          --cov --cov-report=term-missing --cov-report=xml:coverage.xml
          --cov-fail-under=75
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  pipeline-config:
    name: Pipeline config (DVC + single source of truth)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install dvc==3.67.1 pyyaml==6.0.3
      - name: dvc.yaml files parse and form a valid graph
        run: dvc dag
      - name: dvc.lock was produced with the current params.yaml
        run: python scripts/check_params_lock.py
      - name: Alert rules + dashboard thresholds are generated from params.yaml
        run: python scripts/render_alert_rules.py --check

  docker-build:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [tests, pipeline-config]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: backend, context: ., file: backend/Dockerfile}
          - {name: model_server, context: ., file: model_server/Dockerfile}
          - {name: webhook, context: ., file: tools/webhook.Dockerfile}
          - {name: airflow, context: ., file: airflow/Dockerfile}
          - {name: frontend, context: ./frontend, file: frontend/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ddd_${{ matrix.name }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
