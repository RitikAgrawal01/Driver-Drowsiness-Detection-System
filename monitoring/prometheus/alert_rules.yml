# GENERATED by scripts/render_alert_rules.py from params.yaml — do not edit by hand.
# Regenerate: python scripts/render_alert_rules.py   (CI runs it with --check)
groups:
- name: ddd_alerts
  interval: 15s
  rules:
  - alert: HighPredictionErrorRate
    expr: sum(rate(ddd_prediction_errors_total[5m])) / clamp_min(sum(rate(ddd_predictions_total[5m])), 1e-9) > 0.05
    for: 2m
    labels:
      severity: critical
      action: page
    annotations:
      summary: Model calls are failing
      description: '{{ $value | humanizePercentage }} of model calls failed over 5m (SLO 0.05). Users see state=error, not
        alert.'
  - alert: HighInferenceLatency
    expr: histogram_quantile(0.95, sum by (le) (rate(ddd_inference_latency_seconds_bucket[5m]))) > 0.2
    for: 2m
    labels:
      severity: warning
      action: page
    annotations:
      summary: P95 frame-to-prediction latency above SLO
      description: P95 is {{ $value | humanizeDuration }} (SLO 0.2s).
  - alert: DataDriftDetected
    expr: ddd_overall_drift_score > 0.25
    for: 10m
    labels:
      severity: warning
      action: retrain
    annotations:
      summary: Live features drifted from the training baseline
      description: Max PSI {{ $value | humanize }} > 0.25 for 10m. Retraining only helps if new labelled data has been added.
  - alert: ModelNotLoaded
    expr: ddd_model_loaded == 0
    for: 2m
    labels:
      severity: critical
      action: page
    annotations:
      summary: Model server has no model loaded (all predictions fail)
  - alert: DriftBaselineMissing
    expr: ddd_drift_baseline_loaded == 0
    for: 10m
    labels:
      severity: warning
      action: page
    annotations:
      summary: Backend could not load the champion's drift baseline; drift is unmonitored
  - alert: ModelServerDown
    expr: up{job="ddd_model_server"} == 0
    for: 1m
    labels:
      severity: critical
      action: page
    annotations:
      summary: Model server is unreachable
  - alert: BackendDown
    expr: up{job="ddd_backend"} == 0
    for: 1m
    labels:
      severity: critical
      action: page
    annotations:
      summary: Backend API is unreachable
